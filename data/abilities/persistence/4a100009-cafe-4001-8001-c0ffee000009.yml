---

- id: 4a100009-cafe-4001-8001-c0ffee000009
  name: Add account to local Administrators group (L5 step 8)
  description: Add a domain account to the local Administrators group to generate Windows event 4732 (privilege escalation indicator)
  tactic: persistence
  technique:
    attack_id: T1098
    name: Account Manipulation
  platforms:
    windows:
      psh:
        command: |
          $tempUser = "svc_" + (Get-Random -Maximum 9999);
          New-LocalUser -Name $tempUser -NoPassword -ErrorAction SilentlyContinue | Out-Null;
          Add-LocalGroupMember -Group "Administrators" -Member $tempUser -ErrorAction SilentlyContinue;
          Write-Host "[L5-8] Added $tempUser to Administrators -- Windows 4732 generated"
        cleanup: |
          Get-LocalUser | Where-Object { $_.Name -like "svc_*" } | Remove-LocalUser -ErrorAction SilentlyContinue;
          Write-Host "[L5-8] Cleanup: temp local account removed"
