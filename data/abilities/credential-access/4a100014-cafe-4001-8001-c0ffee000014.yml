---

- id: 4a100014-cafe-4001-8001-c0ffee000014
  name: Valid account credential misuse (L8 Sc.2 step 1)
  description: Authenticate to a remote host using known valid credentials to simulate credential abuse — produces Windows 4624 (logon) and 4648 (explicit credentials) events
  tactic: credential-access
  technique:
    attack_id: T1078.002
    name: "Valid Accounts: Domain Accounts"
  platforms:
    windows:
      psh:
        command: |
          net use \\#{lateral.host.ip}\IPC$ "#{domain.user.password}" /user:#{domain}\#{domain.user.name} 2>&1 | Out-Null;
          Write-Host "[L8sc2-1] Credential misuse to #{lateral.host.ip} as #{domain}\#{domain.user.name} -- 4624/4648 generated";
          net use \\#{lateral.host.ip}\IPC$ /delete /y 2>&1 | Out-Null
