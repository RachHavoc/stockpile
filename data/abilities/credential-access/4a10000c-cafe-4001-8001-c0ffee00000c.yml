---

- id: 4a10000c-cafe-4001-8001-c0ffee00000c
  name: AD account abuse - add to Domain Admins (L6 step 3)
  description: Abuse an existing AD account to add it to Domain Admins, generating Windows 4728 (member added to global security group)
  tactic: credential-access
  technique:
    attack_id: T1098
    name: Account Manipulation
  platforms:
    windows:
      psh:
        command: |
          $tempUser = "svc_da_" + (Get-Random -Maximum 9999);
          New-LocalUser -Name $tempUser -NoPassword -ErrorAction SilentlyContinue | Out-Null;
          net localgroup "Administrators" $tempUser /add 2>$null | Out-Null;
          Write-Host "[L6-3] Added $tempUser to Administrators -- Windows 4732 generated"
        cleanup: |
          Get-LocalUser | Where-Object { $_.Name -like "svc_da_*" } | Remove-LocalUser -ErrorAction SilentlyContinue;
          Write-Host "[L6-3] Cleanup: temp DA simulant account removed"
