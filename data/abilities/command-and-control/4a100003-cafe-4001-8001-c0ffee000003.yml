---

- id: 4a100003-cafe-4001-8001-c0ffee000003
  name: DNS query to never-before-seen domain (L5 step 2)
  description: Resolve a randomly-generated domain to produce a Zeek dns.log entry and trigger Suricata DNS detection rules
  tactic: command-and-control
  technique:
    attack_id: T1071.004
    name: "Application Layer Protocol: DNS"
  platforms:
    windows:
      psh:
        command: |
          $random = -join ((65..90) + (97..122) | Get-Random -Count 12 | ForEach-Object { [char]$_ });
          $domain = "$random.soc-lab-beacon.invalid";
          Write-Host "[L5-2] Querying domain: $domain";
          Resolve-DnsName -Name $domain -ErrorAction SilentlyContinue | Out-Null;
          nslookup $domain 2>$null | Out-Null
