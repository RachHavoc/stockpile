---

- id: 4a100002-cafe-4001-8001-c0ffee000002
  name: Encoded PowerShell execution (L5 step 1)
  description: Execute a Base64-encoded PowerShell payload to generate Sysmon EID 1 and Windows 4688 with the -enc flag visible in command-line telemetry
  tactic: execution
  technique:
    attack_id: T1059.001
    name: "Command and Scripting Interpreter: PowerShell"
  platforms:
    windows:
      psh:
        command: |
          $payload = 'Write-Host "[L5-1] Encoded PowerShell executed on $env:COMPUTERNAME"';
          $encoded = [Convert]::ToBase64String([System.Text.Encoding]::Unicode.GetBytes($payload));
          powershell.exe -NoP -NonI -W Hidden -Enc $encoded
