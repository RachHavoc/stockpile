---

- id: 4a10000b-cafe-4001-8001-c0ffee00000b
  name: Encoded PowerShell dropper post-phishing (L6 step 2)
  description: Run an encoded PowerShell stage that simulates malware dropped after a phishing click, generating Sysmon EID 1 with -enc flag
  tactic: execution
  technique:
    attack_id: T1059.001
    name: "Command and Scripting Interpreter: PowerShell"
  platforms:
    windows:
      psh:
        command: |
          $stage2 = 'Set-Content -Path "$env:TEMP\stage2_marker.log" -Value "[L6] Stage-2 dropper executed at $(Get-Date)"; Write-Host "[L6-2] Stage-2 dropper running on $env:COMPUTERNAME"';
          $encoded = [Convert]::ToBase64String([System.Text.Encoding]::Unicode.GetBytes($stage2));
          powershell.exe -NoP -NonI -W Hidden -Enc $encoded
        cleanup: |
          Remove-Item -Force "$env:TEMP\stage2_marker.log" -ErrorAction SilentlyContinue;
          Write-Host "[L6-2] Cleanup: stage2 marker removed"
